[project]
name = "monitoring-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "alembic>=1.19.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Тесты сервисов асинхронные целиком; режим auto избавляет от декоратора
# на каждой функции.
asyncio_mode = "auto"
